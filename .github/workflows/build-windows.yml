name: Сборка Windows WebView2 (Tauri v2)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Настройка Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Установка зависимостей проекта
        run: npm install --legacy-peer-deps

      - name: Сборка веб-приложения и упаковка Tauri WebView2
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Считаю быстро v__VERSION__'
          releaseBody: 'Автоматическая сборка Windows (Microsoft Edge WebView2)'
          releaseDraft: false
          prerelease: false

      - name: Загрузка артефактов в GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Schitayu-Bystro-Windows-WebView2
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
          if-no-files-found: warn
          retention-days: 30
